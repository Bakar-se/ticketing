services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres # dev-only credential; becomes a K8s Secret in Phase 2
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18+ path
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # BullMQ expects noeviction so Redis never silently drops queued jobs
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  auth-migrate:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4001"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth_db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: http://localhost:4001 # the public URL the browser uses
      WEB_ORIGIN: http://localhost:3000
      EXPO_DEV: "true" # dev only: trust Expo Go origins
      REDIS_URL: redis://redis:6379
    ports:
      - "4001:4001"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tickets_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tickets_db
      AUTH_URL: http://auth:4001 # service-to-service call over the Compose network
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  notifications:
    build:
      context: .
      dockerfile: apps/notifications/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: tickets@example.local
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    # No healthcheck: this worker has no HTTP port. We'll solve that with a probe in Phase 2.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000 # what the BROWSER calls
        NEXT_PUBLIC_AUTH_URL: http://localhost:4001
    restart: unless-stopped
    environment:
      AUTH_INTERNAL_URL: http://auth:4001 # what the Next SERVER (proxy.ts) calls
    ports:
      - "3000:3000"
    depends_on:
      auth:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/signin').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
